[project]
name = "swin2sr-x4-super-resolution-pipeline"
version = "0.1.0"
description = "DIMER task-inference pipeline for Swin2SR 4x classical single-image super-resolution (caidas/swin2SR-classical-sr-x4-64): digest-verified loading, Y-channel PSNR/SSIM against bicubic and nearest baselines, and a two-mode BYOD path"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "torch==2.14.0",
  "transformers==4.57.6",
  "safetensors==0.8.0",
  "huggingface-hub==0.36.2",
  "numpy==2.5.3",
  "pillow==11.3.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/swin2sr_x4_super_resolution_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
